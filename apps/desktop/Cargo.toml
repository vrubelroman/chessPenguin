[package]
name = "chesspenguin"
description = "Chess database for Linux: view, enter and analyse PGN games with UCI engines"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chess-core.workspace = true
maia.workspace = true
game-review.workspace = true
prep.workspace = true
chess-import.workspace = true
shakmaty.workspace = true
uci.workspace = true
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
image.workspace = true
rfd.workspace = true
arboard.workspace = true
rodio.workspace = true
directories.workspace = true
trainer.workspace = true
play.workspace = true
serde.workspace = true
serde_json.workspace = true
online-games.workspace = true
releases.workspace = true
# Downloading the official Stockfish on request (decision 14).
ureq = "3.4"
flate2 = "1.1"
tar = "0.4"
sha2 = "0.11"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The system language for the first start.
sys-locale = "0.3"
whatlang = "0.18.0"
getrandom = "0.3"
# Today's date for a new game.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Warnings of the window and graphics libraries into chesspenguin.log.
log = "0.4"
base64 = "0.22"
form_urlencoded = "1"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
skrifa = "0.44"
