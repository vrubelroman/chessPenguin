# Flatpak manifest. CI builds a .flatpak bundle with network access during the build
# (cargo fetches crates). For Flathub, vendored sources (flatpak-cargo-generator) would be needed.
app-id: io.github.vrubelroman.chessPenguin
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: chesspenguin
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  # PGN files and UCI engine executables live in the user's home.
  - --filesystem=home
  # The update check (GitHub) and the user's games from Lichess and Chess.com.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/chesspenguin/cargo
modules:
  # Bundled Stockfish (GPL-3.0). Keep in sync with packaging/stockfish.sh.
  - name: stockfish
    buildsystem: simple
    build-commands:
      - install -Dm755 stockfish-linux-x86-64-universal /app/lib/chesspenguin/stockfish
      - install -Dm644 Copying.txt /app/share/licenses/chesspenguin/stockfish-Copying.txt
    sources:
      - type: archive
        url: https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
        sha256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f
  - name: chesspenguin
    buildsystem: simple
    build-commands:
      - cargo build --release --locked -p chesspenguin
      - install -Dm755 target/release/chesspenguin /app/bin/chesspenguin
      - install -Dm644 packaging/io.github.vrubelroman.chessPenguin.desktop /app/share/applications/io.github.vrubelroman.chessPenguin.desktop
      - install -Dm644 packaging/io.github.vrubelroman.chessPenguin.metainfo.xml /app/share/metainfo/io.github.vrubelroman.chessPenguin.metainfo.xml
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 packaging/icons/hicolor/${s}x${s}/apps/io.github.vrubelroman.chessPenguin.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.vrubelroman.chessPenguin.png; done
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .flatpak-builder
          - pgnFilesforExample
          - engines
          - build
