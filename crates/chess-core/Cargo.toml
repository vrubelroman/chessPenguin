[package]
name = "chess-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shakmaty.workspace = true
encoding_rs.workspace = true
thiserror.workspace = true
# The index of a database in serde's terms: the web version reads a database in a
# worker and gives its index to the page (`PgnIndex`).
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
# Independent oracle in corpus tests: the core uses its own lexer (byte offsets,
# coverage diagnostics), pgn-reader is used only to cross-check move counts.
pgn-reader.workspace = true
