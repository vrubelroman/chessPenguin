[workspace]
resolver = "3"
members = [
    "crates/chess-core",
    "crates/chess-import",
    "crates/uci",
    "crates/openings",
    "crates/game-review",
    "crates/online-games",
    "crates/releases",
    "crates/mobile-api",
    "crates/maia",
    "crates/trainer",
    "crates/play",
    "crates/prep",
    "apps/desktop",
    "apps/web",
]

[workspace.package]
version = "2.1.2"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
authors = ["vrubelroman <vrubelroman@gmail.com>"]
repository = "https://github.com/vrubelroman/chessPenguin"
homepage = "https://github.com/vrubelroman/chessPenguin"

[workspace.dependencies]
shakmaty = "0.30.2"
pgn-reader = "0.29.1"
encoding_rs = "0.8"
thiserror = "2"
# `Instant`/`SystemTime` that also work in a browser (std's panic there).
web-time = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "=0.36.2"
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "links"] }
egui_extras = { version = "=0.36.2", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17"
arboard = { version = "3.6", features = ["wayland-data-control"] }
rodio = "0.22"
directories = "6"
chess-core = { path = "crates/chess-core" }
chess-import = { path = "crates/chess-import" }
uci = { path = "crates/uci" }
maia = { path = "crates/maia" }
game-review = { path = "crates/game-review" }
chess-openings = { path = "crates/openings" }
online-games = { path = "crates/online-games" }
releases = { path = "crates/releases" }
trainer = { path = "crates/trainer" }
play = { path = "crates/play" }
prep = { path = "crates/prep" }

[profile.dev.package."*"]
opt-level = 2

# The web version (apps/web/build.sh): small to download, the release otherwise.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
